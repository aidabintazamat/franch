<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ORDO × TikTok — connecting</title>
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="../icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css?v=2">
</head>
<body data-page="callback">
<header class="top">
  <div class="wrap">
    <a href="/tiktok/" aria-label="ORDO"><img class="logo" src="../ordo360_logo.svg" alt="ORDO 360"></a>
    <div class="lang" role="group" aria-label="Language"><button data-l="en">EN</button><button data-l="ru">RU</button></div>
  </div>
</header>
<main class="wrap" style="padding-top:48px">
  <section class="card">
    <div class="big-ok">
      <div class="ic" id="cbIcon">…</div>
      <div><h2 id="cbTitle" data-i="cb_wait"></h2><p class="sub" id="cbText" data-i="allow_local" style="margin:4px 0 0"></p></div>
    </div>
    <div class="account hidden" id="cbAcc" style="margin-top:20px">
      <img id="cbAvatar" alt="">
      <div><div class="name" id="cbName"></div><div class="handle" id="cbHandle"></div></div>
    </div>
    <p style="margin-top:20px">
      <a class="btn btn-green hidden" id="cbGo" href="/tiktok/#publish"><span data-i="go_publish"></span> →</a>
      <a class="btn btn-ghost hidden" id="cbBack" href="/tiktok/"><span data-i="back"></span></a>
    </p>
  </section>
</main>
<footer>
  <div class="wrap">
    <span>© 2026 ORDO Holding · ORDO 360</span>
    <span>
      <a href="https://ordo.education/p/publicoffer" data-i="footer_terms"></a> ·
      <a href="https://ordo.education/p/privacy-policy" data-i="footer_privacy"></a>
    </span>
  </div>
</footer>
<script src="../app.js?v=5"></script>
</body>
</html>
