<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ORDO × TikTok — publish videos</title>
<meta name="description" content="ORDO × TikTok: connect a TikTok account with Login Kit and publish ORDO educational videos via the Content Posting API.">
<meta name="robots" content="noindex">
<link rel="canonical" href="https://franch.ordogen.education/tiktok/">
<link rel="icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=1">
</head>
<body data-page="main">
<header class="top">
  <div class="wrap">
    <a href="https://ordo.education" aria-label="ORDO"><img class="logo" src="ordo360_logo.svg" alt="ORDO 360"></a>
    <div class="lang" role="group" aria-label="Language"><button data-l="en">EN</button><button data-l="ru">RU</button></div>
  </div>
</header>

<main class="wrap">
  <div class="hero">
    <span class="eyebrow" data-i="eyebrow"></span>
    <h1 data-i="h1"></h1>
    <p class="lead" data-i="lead"></p>
    <a class="btn btn-tt" data-connect href="#">
      <svg class="tt-ico" viewBox="0 0 48 48" fill="currentColor" aria-hidden="true"><path d="M34.1 6c.6 4.9 3.4 8.3 8.4 8.6v5.6c-2.9.3-5.4-.7-8.3-2.4v10.6c0 13.5-14.7 17.7-20.6 8.1-3.8-6.2-1.5-17 10.7-17.4v5.9c-.9.1-1.9.4-2.8.7-2.7.9-4.3 2.7-3.9 5.8.9 5.9 11.7 7.6 10.8-3.9V6h5.7z"/></svg>
      <span data-i="connect"></span>
    </a>
    <div class="status"><span class="dot wait" id="localDot"></span><span id="localTxt">…</span></div>
    <div class="steps">
      <div class="step"><b>1</b><h3 data-i="s1h"></h3><p data-i="s1p"></p></div>
      <div class="step"><b>2</b><h3 data-i="s2h"></h3><p data-i="s2p"></p></div>
      <div class="step"><b>3</b><h3 data-i="s3h"></h3><p data-i="s3p"></p></div>
    </div>
  </div>

  <section class="card hidden" id="needConnect">
    <p class="empty" data-i="connect_first"></p>
    <p class="note" data-i="allow_local"></p>
  </section>

  <div id="connected" class="hidden">
    <section class="card">
      <h2 data-i="acc_h"></h2>
      <p class="sub" data-i="acc_sub"></p>
      <div class="account">
        <img id="accAvatar" alt="">
        <div><div class="name" id="accName"></div><div class="handle" id="accHandle"></div>
          <a id="accLink" class="hidden" target="_blank" rel="noopener" style="font-size:13px">tiktok.com ↗</a></div>
        <div class="stats">
          <div><b id="stFollowers">—</b><span data-i="followers"></span></div>
          <div><b id="stFollowing">—</b><span data-i="following"></span></div>
          <div><b id="stLikes">—</b><span data-i="likes"></span></div>
          <div><b id="stVideos">—</b><span data-i="videos_c"></span></div>
        </div>
      </div>
      <div class="msg" id="accMsg"></div>
    </section>

    <section class="card" id="publishCard">
      <h2 data-i="pub_h"></h2>
      <p class="sub" data-i="pub_sub"></p>
      <div class="pub">
        <div class="preview" id="preview">▶</div>
        <div>
          <label class="f"><span data-i="queue"></span><span id="maxDur" style="font-weight:400;color:var(--muted)"></span></label>
          <div class="queue" id="queue"></div>

          <label class="f" data-i="posting_to"></label>
          <div class="account" style="gap:10px"><img id="crAvatar" alt="" style="width:36px;height:36px"><span id="crName" style="font-weight:600"></span></div>

          <label class="f" for="caption" data-i="caption"></label>
          <textarea id="caption" maxlength="2200"></textarea>
          <div class="count" id="capCount">0 / 2200</div>

          <label class="f" for="privacy" data-i="privacy"></label>
          <select id="privacy"><option value="" disabled selected>…</option></select>

          <label class="f" data-i="allow"></label>
          <div class="toggles">
            <label class="chk"><input type="checkbox" id="allow_comment"><span data-i="comment"></span></label>
            <label class="chk"><input type="checkbox" id="allow_duet"><span data-i="duet"></span></label>
            <label class="chk"><input type="checkbox" id="allow_stitch"><span data-i="stitch"></span></label>
          </div>

          <div class="disclose">
            <div class="row">
              <div><b data-i="disc_h"></b><p class="hint" data-i="disc_p"></p></div>
              <label class="switch"><input type="checkbox" id="discToggle"><span></span></label>
            </div>
            <div id="discOpts" class="hidden" style="margin-top:10px">
              <label class="chk"><input type="checkbox" id="discYour"><b data-i="yourbrand"></b></label>
              <p class="hint" data-i="yourbrand_p" style="margin-left:26px"></p>
              <label class="chk" style="margin-top:8px"><input type="checkbox" id="discBranded"><b data-i="branded"></b></label>
              <p class="hint" data-i="branded_p" style="margin-left:26px"></p>
            </div>
            <p class="hint hidden" id="discWarn" style="color:var(--red)"></p>
          </div>

          <p class="note" id="agree"></p>
          <button class="btn btn-green" id="publishBtn" disabled>
            <svg class="tt-ico" viewBox="0 0 48 48" fill="currentColor" aria-hidden="true"><path d="M34.1 6c.6 4.9 3.4 8.3 8.4 8.6v5.6c-2.9.3-5.4-.7-8.3-2.4v10.6c0 13.5-14.7 17.7-20.6 8.1-3.8-6.2-1.5-17 10.7-17.4v5.9c-.9.1-1.9.4-2.8.7-2.7.9-4.3 2.7-3.9 5.8.9 5.9 11.7 7.6 10.8-3.9V6h5.7z"/></svg>
            <span data-i="publish"></span>
          </button>
          <div class="msg" id="pubMsg"></div>
        </div>
      </div>
    </section>

    <section class="card">
      <h2 data-i="list_h"></h2>
      <p class="sub" data-i="list_sub"></p>
      <div class="videos" id="videoList"><p class="empty">…</p></div>
    </section>

    <section class="card" id="rules">
      <h2 data-i="rules_h"></h2>
      <p class="sub" data-i="rules_sub"></p>
      <div data-i="rules_html"></div>
    </section>

    <p style="text-align:center"><a class="btn btn-ghost" data-connect href="#"><span data-i="reconnect"></span></a></p>
  </div>
</main>

<footer>
  <div class="wrap">
    <span>© 2026 ORDO Holding · ORDO 360</span>
    <span>
      <a href="https://ordo.education/p/publicoffer" data-i="footer_terms"></a> ·
      <a href="https://ordo.education/p/privacy-policy" data-i="footer_privacy"></a> ·
      <a href="https://ordo.education" data-i="footer_contact"></a>
    </span>
  </div>
</footer>
<script src="app.js?v=3"></script>
</body>
</html>
